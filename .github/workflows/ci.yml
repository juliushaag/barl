name: CI

on:
  push:
    branches: [master]
  pull_request:

# Deliberately does not `uv sync` the project: that pulls jax[cuda13] and every
# simulator (dm-control, mani-skill, humanoid-bench via the third_party
# submodule, ...), which is neither available nor needed on a CPU runner. Each
# job installs the package with `--no-deps` plus only what it needs.
env:
  # The local executor shells out through `uv run` when uv is on PATH;
  # UV_NO_SYNC makes that reuse the prepared .venv instead of syncing the
  # full CUDA/simulator dependency set.
  UV_NO_SYNC: "1"
  JAX_PLATFORMS: cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # uvx runs ruff from its own isolated environment: no Python install needed.
      - run: uvx ruff@0.16.3 check .

  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.11"}
      # EGL for the tests that render evaluation episodes. Retried: the runner's
      # package mirrors fail transiently (DNS) often enough to fail a whole run.
      - name: Install EGL
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update || true
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libegl1 libgl1 && exit 0
            echo "apt attempt $attempt failed; retrying"; sleep $((attempt * 10))
          done
          exit 1
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python --no-deps -e .
      # jax==0.10.0 is pinned (matches uv.lock): a couple of the vmap-vs-per-slot
      # equality tests compare at atol=1e-5, tight enough that newer jaxlib CPU
      # kernels round differently and fail spuriously.
      - run: >-
          uv pip install --python .venv/bin/python
          "jax==0.10.0" numpy flax optax orbax-checkpoint "gymnasium[classic-control]"
          mujoco imageio pyyaml rich pytest pytest-xdist
      - run: MUJOCO_GL=egl .venv/bin/python -m pytest tests/ -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.11"}
      - run: uv build --wheel --out-dir /tmp/barl-dist
      - run: uv venv --python 3.11 /tmp/barl-wheel
      - run: uv pip install --python /tmp/barl-wheel/bin/python --no-deps /tmp/barl-dist/*.whl
      - run: uv pip install --python /tmp/barl-wheel/bin/python "jax==0.10.0" numpy flax optax gymnasium pyyaml
      - run: cd /tmp && /tmp/barl-wheel/bin/python -c "from barl_jax.policy import Policy; assert Policy.available()"

  cpu-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.11"}
      # examples/cpu_quickstart.py needs no simulator beyond gymnasium's own
      # classic-control Pendulum-v1, no CUDA and no W&B account.
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python --no-deps -e .
      - run: >-
          uv pip install --python .venv/bin/python
          "jax==0.10.0" numpy flax optax orbax-checkpoint "gymnasium[classic-control]"
          imageio pyyaml rich
      - run: BARL_ALLOW_CPU=1 timeout 300 .venv/bin/python -m examples.cpu_quickstart
